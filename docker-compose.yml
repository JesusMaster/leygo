# leygo en producción: backend + GUI detrás de Caddy (TLS automático).
# Un solo dominio: la GUI en / y la API en /api, /run, /a2a, … (mismo origen → sin CORS).
services:
  # Imágenes compiladas de leygo (ghcr.io). LEYGO_VERSION en .env fija una versión.
  agent:
    image: ${LEYGO_REGISTRO:-ghcr.io/jesusmaster}/leygo-agent:${LEYGO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATA_DIR: /app/data
      # Dirección con la que se abre esta instalación (la pone instalar.sh; solo se usa en mensajes).
      LEYGO_URL_LOCAL: ${LEYGO_URL_LOCAL:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    # Para usar Redis, Qdrant u Ollama que ya corren en tu computador (host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  gui:
    image: ${LEYGO_REGISTRO:-ghcr.io/jesusmaster}/leygo-gui:${LEYGO_VERSION:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # LEYGO_PUERTO: puerto de la interfaz en tu computador (./instalar.sh --puerto 8080).
    # LEYGO_HTTPS: "443:443" con dominio propio; "443" (puerto al azar) en instalaciones locales,
    # así varios leygo pueden convivir en el mismo computador.
    ports:
      - "${LEYGO_PUERTO:-80}:80"
      - "${LEYGO_HTTPS:-443:443}"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [agent, gui]

  # Botón "Actualizar" de la interfaz (perfil "actualizador", lo activa instalar.sh en la instalación
  # descargada). Es el ÚNICO servicio con acceso a Docker: el agente deja el pedido en
  # data/actualizacion y este baja las imágenes nuevas de agent y gui y los reinicia (deploy/actualizador.sh).
  # La carpeta va montada en la misma ruta que en tu computador (LEYGO_DIR) para que docker compose
  # encuentre ./data, ./config y el .env. Sin él, se actualiza con ./instalar.sh.
  actualizador:
    image: docker:27-cli
    profiles: [actualizador]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "${LEYGO_DIR:-/leygo}/deploy/actualizador.sh"]
    environment:
      LEYGO_DIR: ${LEYGO_DIR:-/leygo}
    volumes:
      - ${LEYGO_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${LEYGO_DIR:-.}:${LEYGO_DIR:-/leygo}
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }

  # Servicios opcionales, cada uno con su perfil. Levanta solo los que no tengas:
  #   ./instalar.sh --redis --qdrant          (o --todo)
  #   docker compose --profile redis --profile qdrant up -d
  # El perfil "local" levanta los tres. Sin perfil no se levanta ninguno (producción o instancias propias).
  redis:
    image: redis:7-alpine
    profiles: [local, redis]
    restart: unless-stopped
    # Si no puede guardar su copia en disco (p. ej. disco lleno), sigue funcionando en vez de bloquear
    # todas las escrituras (error MISCONF): leygo no se detiene y la copia se reintenta sola.
    command: ["redis-server", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    profiles: [local, qdrant]
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  # Modelos y embeddings locales. El asistente descarga el modelo de embeddings que elijas.
  ollama:
    image: ollama/ollama:latest
    profiles: [local, ollama]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  qdrant_data:
  ollama_data:
